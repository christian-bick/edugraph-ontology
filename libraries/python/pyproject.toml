[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "edugraph-py"
version = "0.0.0"
description = "Typed EduGraph ontology snapshots, navigation, and deduction queries"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "EduGraph", email = "christian.bick@bitsuppliers.com" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
    "Operating System :: OS Independent",
]
dependencies = []

[project.optional-dependencies]
rdf = ["pyoxigraph>=0.5.11,<0.6"]

[project.urls]
Repository = "https://github.com/christian-bick/edugraph-ontology"
Documentation = "https://github.com/christian-bick/edugraph-ontology/blob/main/libraries/python/README.md"

[dependency-groups]
dev = ["mypy==1.18.2", "ruff==0.13.2", "pytest==8.4.2", "build==1.3.0"]

[tool.mypy]
python_version = "3.11"
strict = true
disallow_any_unimported = true
disallow_any_explicit = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.hatch.build.targets.wheel]
packages = ["src/edugraph"]

[tool.hatch.build.targets.sdist]
include = ["src/edugraph", "pyproject.toml", "README.md", "LICENSE"]
