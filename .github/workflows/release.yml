name: Release

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*.*.*'

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      package_version: ${{ steps.version.outputs.package_version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_name: ${{ steps.version.outputs.release_name }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Test version resolution
        run: python -m unittest discover -s src/ontology -p test_release_version.py

      - name: Resolve ontology artifact version
        id: version
        env:
          RELEASE_REF: ${{ github.ref }}
        run: python src/ontology/release-version.py "$RELEASE_REF" >> "$GITHUB_OUTPUT"

      - name: Generate all ontology files
        run: docker build --build-arg PACKAGE_VERSION=${{ steps.version.outputs.package_version }} . --output dist

      - uses: actions/upload-artifact@v4
        with:
          name: release-assets
          path: dist

  python:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, python: '3.11' }
          - { os: ubuntu-latest, python: '3.12' }
          - { os: ubuntu-latest, python: '3.13' }
          - { os: ubuntu-latest, python: '3.14' }
          - { os: windows-latest, python: '3.14' }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist
      - name: Install test environment
        shell: bash
        run: |
          uv venv --no-project --python ${{ matrix.python }}
          uv pip install -r libraries/python/requirements-dev.lock
          uv pip install dist/python/dist/*.whl
      - name: Verify installed Python API and distributions
        shell: bash
        run: |
          uv run --no-project --no-sync python -m pytest libraries/python/tests libraries/python/test_relations.py -q
          uv run --no-project --no-sync python -m mypy --strict libraries/python/tests/typed_consumer.py
          uv run --no-project --no-sync python libraries/python/verify_package.py dist/python/dist

  release:
    needs: [build, python]
    runs-on: ubuntu-latest
    env:
      PACKAGE_VERSION: ${{ needs.build.outputs.package_version }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          name: release-assets
          path: dist

      - name: Update package.json version
        run: |
          cd dist/typescript
          npm version ${{ env.PACKAGE_VERSION }} --no-git-tag-version
          cd ../..

      - name: Create tarball
        run: |
          cd dist/typescript
          npm pack --pack-destination ../..
          cd ../..
          mv edugraph-ts-${{ env.PACKAGE_VERSION }}.tgz edugraph-ts.tgz

      - name: Set Python Asset Paths
        run: |
          echo "WHEEL_PATH=$(ls dist/python/dist/*.whl)" >> $GITHUB_ENV
          echo "SDIST_PATH=$(ls dist/python/dist/*.tar.gz)" >> $GITHUB_ENV
          echo "WHEEL_NAME=$(basename dist/python/dist/*.whl)" >> $GITHUB_ENV
          echo "SDIST_NAME=$(basename dist/python/dist/*.tar.gz)" >> $GITHUB_ENV

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ needs.build.outputs.release_tag }}
          release_name: ${{ needs.build.outputs.release_name }}
          body_path: ${{ startsWith(github.ref, 'refs/tags/') && format('docs/releases/{0}.md', github.ref_name) || '' }}
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Upload core-schema.ttl
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/core-schema.ttl
          asset_name: core-schema.ttl
          asset_content_type: plain/turtle

      - name: Upload core-abilities.ttl
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/core-abilities.ttl
          asset_name: core-abilities.ttl
          asset_content_type: plain/turtle

      - name: Upload core-areas-math.ttl
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/core-areas-math.ttl
          asset_name: core-areas-math.ttl
          asset_content_type: plain/turtle

      - name: Upload core-scopes-math.ttl
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/core-scopes-math.ttl
          asset_name: core-scopes-math.ttl
          asset_content_type: plain/turtle

      - name: Upload core-ontology-math.rdf
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./dist/core-ontology-math.rdf
          asset_name: core-ontology-math.rdf
          asset_content_type: application/xml+rdf

      - name: Upload TypeScript Package
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ./edugraph-ts.tgz
          asset_name: edugraph-ts.tgz
          asset_content_type: application/gzip

      - name: Upload Python Wheel
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.WHEEL_PATH }}
          asset_name: ${{ env.WHEEL_NAME }}
          asset_content_type: application/octet-stream

      - name: Upload Python Source Dist
        uses: actions/upload-release-asset@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: ${{ env.SDIST_PATH }}
          asset_name: ${{ env.SDIST_NAME }}
          asset_content_type: application/gzip

      - name: Clean up older pre-releases
        uses: sgpublic/delete-release-action@v1.2
        with:
          pre-release-drop: true
          pre-release-keep-count: ${{ startsWith(github.ref, 'refs/tags/') && -1 || 0 }}
          pre-release-drop-tag: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
